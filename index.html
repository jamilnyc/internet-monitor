<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internet Connectivity Monitor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }

  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 1.5rem; color: #fff; }

  .status-card {
    background: #1a1d28;
    border-radius: 16px;
    padding: 2.5rem 3rem;
    text-align: center;
    width: 100%;
    max-width: 480px;
    margin-bottom: 1.5rem;
    border: 1px solid #2a2d3a;
  }

  .status-dot {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    margin: 0 auto 1.2rem;
    transition: background 0.4s, box-shadow 0.4s;
  }

  .status-dot.online {
    background: #22c55e;
    box-shadow: 0 0 40px rgba(34, 197, 94, 0.4);
  }

  .status-dot.offline {
    background: #ef4444;
    box-shadow: 0 0 40px rgba(239, 68, 68, 0.4);
  }

  .status-dot.checking {
    background: #f59e0b;
    box-shadow: 0 0 40px rgba(245, 158, 11, 0.4);
  }

  .status-text {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 0.3rem;
  }

  .status-text.online { color: #22c55e; }
  .status-text.offline { color: #ef4444; }
  .status-text.checking { color: #f59e0b; }

  .status-duration, .status-countdown {
    font-size: 0.9rem;
    color: #888;
    margin-top: 0.3rem;
  }

  .actions {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    margin-top: 1.2rem;
  }

  button {
    padding: 0.55rem 1.2rem;
    border: 1px solid #3a3d4a;
    border-radius: 8px;
    background: #252836;
    color: #e0e0e0;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover { background: #333649; }
  button:active { background: #3e4258; }
  button.danger { border-color: #7f1d1d; color: #fca5a5; }
  button.danger:hover { background: #450a0a; }

  .history-section {
    width: 100%;
    max-width: 600px;
  }

  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
  }

  .history-header h2 { font-size: 1.1rem; font-weight: 600; }

  .history-list {
    max-height: 420px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .history-entry {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.6rem 0.9rem;
    background: #1a1d28;
    border-radius: 8px;
    font-size: 0.82rem;
    border: 1px solid #2a2d3a;
  }

  .history-entry .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .history-entry .dot.online { background: #22c55e; }
  .history-entry .dot.offline { background: #ef4444; }

  .history-entry .time { color: #888; white-space: nowrap; }
  .history-entry .label { flex: 1; }
  .history-entry .duration { color: #888; white-space: nowrap; }

  .empty-history {
    text-align: center;
    color: #555;
    padding: 2rem;
    font-size: 0.9rem;
  }

  .history-list::-webkit-scrollbar { width: 6px; }
  .history-list::-webkit-scrollbar-track { background: transparent; }
  .history-list::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  .endpoints-section {
    width: 100%;
    max-width: 600px;
    margin-bottom: 1.5rem;
  }

  .endpoints-toggle {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: none;
    border: none;
    color: #aaa;
    font-size: 0.9rem;
    cursor: pointer;
    padding: 0.4rem 0;
    width: 100%;
    text-align: left;
  }

  .endpoints-toggle:hover { color: #fff; background: none; }
  .endpoints-toggle:active { background: none; }

  .endpoints-toggle .arrow {
    display: inline-block;
    transition: transform 0.2s;
    font-size: 0.7rem;
  }

  .endpoints-toggle .arrow.open { transform: rotate(90deg); }

  .endpoints-list {
    display: none;
    flex-direction: column;
    gap: 4px;
    margin-top: 0.5rem;
  }

  .endpoints-list.open { display: flex; }

  .endpoint-entry {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem 0.9rem;
    background: #1a1d28;
    border-radius: 8px;
    font-size: 0.82rem;
    border: 1px solid #2a2d3a;
  }

  .endpoint-entry .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .endpoint-entry .dot.reachable { background: #22c55e; }
  .endpoint-entry .dot.unreachable { background: #ef4444; }
  .endpoint-entry .dot.pending { background: #555; }

  .endpoint-entry .url { flex: 1; color: #ccc; word-break: break-all; }
  .endpoint-entry .ep-status { color: #888; white-space: nowrap; }
</style>
</head>
<body>

<h1>Internet Connectivity Monitor</h1>

<div class="status-card">
  <div class="status-dot checking" id="statusDot"></div>
  <div class="status-text checking" id="statusText">Checking...</div>
  <div class="status-duration" id="statusDuration"></div>
  <div class="status-countdown" id="statusCountdown"></div>
  <div class="actions">
    <button id="checkNowBtn" onclick="checkNow()">Check Now</button>
    <button class="danger" onclick="clearHistory()">Clear History</button>
  </div>
</div>

<div class="endpoints-section">
  <button class="endpoints-toggle" onclick="toggleEndpoints()">
    <span class="arrow" id="endpointsArrow">&#9654;</span>
    Checked URLs
  </button>
  <div class="endpoints-list" id="endpointsList"></div>
</div>

<div class="history-section">
  <div class="history-header">
    <h2>Event History</h2>
  </div>
  <div class="history-list" id="historyList">
    <div class="empty-history">No events yet.</div>
  </div>
</div>

<script>
const CHECK_INTERVAL = 4 * 60 * 1000; // 4 minutes
const STORAGE_KEY = 'internet-monitor-history';
const TARGETS = [
  'https://www.google.com/favicon.ico',
  'https://www.cloudflare.com/favicon.ico',
  'https://www.amazon.com/favicon.ico',
  'https://www.apple.com/favicon.ico',
  'https://jsonplaceholder.typicode.com/photos',
];

let currentStatus = null; // 'online' | 'offline'
let statusSince = null;
let nextCheckTime = null;
let checkTimer = null;
let countdownTimer = null;
let targetResults = TARGETS.map(url => ({ url, reachable: null })); // null = not checked yet

// --- Connectivity check ---

async function checkSingle(url) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 5000);
  const start = performance.now();
  try {
    await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: controller.signal });
    return { ok: true, ms: Math.round(performance.now() - start) };
  } catch {
    return { ok: false, ms: null };
  } finally {
    clearTimeout(timeout);
  }
}

async function checkConnectivity() {
  const results = await Promise.allSettled(TARGETS.map(checkSingle));
  const data = results.map(r => r.status === 'fulfilled' ? r.value : { ok: false, ms: null });
  targetResults = TARGETS.map((url, i) => ({ url, reachable: data[i].ok, ms: data[i].ms }));
  renderEndpoints();
  return data.some(d => d.ok);
}

async function performCheck() {
  setStatusUI('checking');
  const online = await checkConnectivity();
  const status = online ? 'online' : 'offline';
  const now = Date.now();

  if (currentStatus !== status) {
    // Status changed
    const wasOffline = currentStatus === 'offline';
    const duration = statusSince ? now - statusSince : 0;
    if (currentStatus !== null) {
      addHistoryEntry(currentStatus, statusSince, duration, true);
    }
    currentStatus = status;
    statusSince = now;
    addHistoryEntry(status, now, 0, false);

    if (wasOffline && status === 'online') {
      notifyBackOnline();
    }
  } else {
    // Same status — update the latest entry duration
    updateLatestEntryDuration(now - statusSince);
  }

  setStatusUI(status);
  scheduleNextCheck();
}

// --- UI ---

function setStatusUI(status) {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.className = 'status-dot ' + status;
  text.className = 'status-text ' + status;

  if (status === 'checking') {
    text.textContent = 'Checking...';
  } else if (status === 'online') {
    text.textContent = 'Online';
  } else {
    text.textContent = 'Offline';
  }

  updateDurationDisplay();
}

function updateDurationDisplay() {
  const el = document.getElementById('statusDuration');
  if (!statusSince || !currentStatus) {
    el.textContent = '';
    return;
  }
  el.textContent = 'Status for ' + formatDuration(Date.now() - statusSince);
}

function updateCountdownDisplay() {
  const el = document.getElementById('statusCountdown');
  if (!nextCheckTime) { el.textContent = ''; return; }
  const remaining = Math.max(0, nextCheckTime - Date.now());
  if (remaining === 0) { el.textContent = 'Checking soon...'; return; }
  el.textContent = 'Next check in ' + formatDuration(remaining);
}

function formatDuration(ms) {
  const totalSec = Math.floor(ms / 1000);
  if (totalSec < 60) return totalSec + 's';
  const mins = Math.floor(totalSec / 60);
  const secs = totalSec % 60;
  if (mins < 60) return mins + 'm ' + secs + 's';
  const hrs = Math.floor(mins / 60);
  const remMins = mins % 60;
  return hrs + 'h ' + remMins + 'm';
}

// --- History ---

function getHistory() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function saveHistory(history) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

function addHistoryEntry(status, timestamp, duration, ended) {
  const history = getHistory();
  history.unshift({ status, timestamp, duration, ended });
  // Keep max 500 entries
  if (history.length > 500) history.length = 500;
  saveHistory(history);
  renderHistory();
}

function updateLatestEntryDuration(duration) {
  const history = getHistory();
  if (history.length > 0 && !history[0].ended) {
    history[0].duration = duration;
    saveHistory(history);
    renderHistory();
  }
}

function renderHistory() {
  const list = document.getElementById('historyList');
  const history = getHistory();
  if (history.length === 0) {
    list.innerHTML = '<div class="empty-history">No events yet.</div>';
    return;
  }
  list.innerHTML = history.map(e => {
    const time = new Date(e.timestamp).toLocaleString();
    const label = e.ended
      ? (e.status === 'online' ? 'Was online' : 'Was offline')
      : (e.status === 'online' ? 'Online' : 'Offline');
    const dur = e.duration > 0 ? formatDuration(e.duration) : 'just now';
    return `<div class="history-entry">
      <span class="dot ${e.status}"></span>
      <span class="time">${time}</span>
      <span class="label">${label}</span>
      <span class="duration">${dur}</span>
    </div>`;
  }).join('');
}

// --- Notification (offline → online) ---

function notifyBackOnline() {
  playReconnectSound();
  if (Notification.permission === 'granted') {
    new Notification('Internet Restored', { body: 'Your connection is back online.', icon: '🟢' });
  } else if (Notification.permission !== 'denied') {
    Notification.requestPermission().then(p => {
      if (p === 'granted') {
        new Notification('Internet Restored', { body: 'Your connection is back online.', icon: '🟢' });
      }
    });
  }
}

function playReconnectSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Three rising tones for a pleasant chime
    [0, 0.15, 0.3].forEach((delay, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = [523, 659, 784][i]; // C5, E5, G5
      gain.gain.setValueAtTime(0.3, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.4);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.4);
    });
  } catch {}
}

// --- Endpoints panel ---

function toggleEndpoints() {
  const list = document.getElementById('endpointsList');
  const arrow = document.getElementById('endpointsArrow');
  const open = list.classList.toggle('open');
  arrow.classList.toggle('open', open);
}

function renderEndpoints() {
  const list = document.getElementById('endpointsList');
  list.innerHTML = targetResults.map(t => {
    const cls = t.reachable === null ? 'pending' : (t.reachable ? 'reachable' : 'unreachable');
    const label = t.reachable === null ? 'Not checked' : (t.reachable ? 'Reachable' : 'Unreachable');
    const time = t.ms !== null && t.ms !== undefined ? t.ms + ' ms' : '—';
    return `<div class="endpoint-entry">
      <span class="dot ${cls}"></span>
      <span class="url">${t.url}</span>
      <span class="ep-status">${time}</span>
      <span class="ep-status">${label}</span>
    </div>`;
  }).join('');
}

function clearHistory() {
  localStorage.removeItem(STORAGE_KEY);
  currentStatus = null;
  statusSince = null;
  renderHistory();
  performCheck();
}

// --- Scheduling ---

function scheduleNextCheck() {
  clearTimeout(checkTimer);
  nextCheckTime = Date.now() + CHECK_INTERVAL;
  checkTimer = setTimeout(performCheck, CHECK_INTERVAL);
}

function checkNow() {
  clearTimeout(checkTimer);
  performCheck();
}

// --- Tick: update duration + countdown every second ---

setInterval(() => {
  updateDurationDisplay();
  updateCountdownDisplay();
}, 1000);

// --- Restore state from history on load ---

function restoreState() {
  const history = getHistory();
  if (history.length > 0 && !history[0].ended) {
    currentStatus = history[0].status;
    statusSince = history[0].timestamp;
  }
  renderHistory();
}

// --- Init ---

restoreState();
renderEndpoints();
if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}
performCheck();
</script>
</body>
</html>
